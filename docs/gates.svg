<svg xmlns="http://www.w3.org/2000/svg" width="900" height="340" viewBox="0 0 900 340" font-family="ui-sans-serif,-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif">
  <rect width="900" height="340" fill="#0d1117"/>
  <text x="32" y="44" fill="#e6edf3" font-size="17" font-weight="600">Two frames in. Four gates decide: same page, or a new record?</text>
  <text x="32" y="70" fill="#8b949e" font-size="13">Fail any gate → new record. Never merge on overlap alone.</text>

  <!-- frames -->
  <g>
    <rect x="32" y="100" width="120" height="46" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="92" y="129" fill="#e6edf3" font-size="13" text-anchor="middle">frame N-1</text>
    <rect x="32" y="176" width="120" height="46" rx="8" fill="#161b22" stroke="#30363d"/>
    <text x="92" y="205" fill="#e6edf3" font-size="13" text-anchor="middle">frame N</text>
  </g>

  <!-- gates -->
  <g>
    <rect x="196" y="96" width="150" height="130" rx="10" fill="#12261e" stroke="#2ea043"/>
    <text x="271" y="124" fill="#3fb950" font-size="12" font-weight="700" text-anchor="middle">GATE 1</text>
    <text x="271" y="148" fill="#e6edf3" font-size="13" text-anchor="middle">time window</text>
    <text x="271" y="168" fill="#8b949e" font-size="11" text-anchor="middle">default 180s</text>

    <rect x="366" y="96" width="150" height="130" rx="10" fill="#12261e" stroke="#2ea043"/>
    <text x="441" y="124" fill="#3fb950" font-size="12" font-weight="700" text-anchor="middle">GATE 2</text>
    <text x="441" y="148" fill="#e6edf3" font-size="13" text-anchor="middle">same page type</text>
    <text x="441" y="168" fill="#8b949e" font-size="11" text-anchor="middle">article / chat / list</text>

    <rect x="536" y="96" width="150" height="130" rx="10" fill="#12261e" stroke="#2ea043"/>
    <text x="611" y="124" fill="#3fb950" font-size="12" font-weight="700" text-anchor="middle">GATE 3</text>
    <text x="611" y="148" fill="#e6edf3" font-size="13" text-anchor="middle">same anchor</text>
    <text x="611" y="168" fill="#8b949e" font-size="11" text-anchor="middle">header / speakers</text>

    <rect x="706" y="96" width="150" height="130" rx="10" fill="#12261e" stroke="#2ea043"/>
    <text x="781" y="124" fill="#3fb950" font-size="12" font-weight="700" text-anchor="middle">GATE 4</text>
    <text x="781" y="148" fill="#e6edf3" font-size="13" text-anchor="middle">real overlap</text>
    <text x="781" y="168" fill="#8b949e" font-size="11" text-anchor="middle">≥ 2 identical lines</text>
  </g>

  <!-- connectors -->
  <g stroke="#30363d" stroke-width="1.5" fill="none">
    <path d="M152 123 H176 V161 H196"/>
    <path d="M152 199 H176 V161"/>
    <path d="M346 161 H366"/>
    <path d="M516 161 H536"/>
    <path d="M686 161 H706"/>
  </g>

  <!-- outcomes -->
  <g>
    <rect x="196" y="256" width="660" height="52" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="216" y="278" fill="#e6edf3" font-size="13">all four pass → <tspan fill="#3fb950" font-weight="700">merge into the same record</tspan> (mode: roll)</text>
    <text x="216" y="297" fill="#e6edf3" font-size="13">any one fails → <tspan fill="#f85149" font-weight="700">seal the record, start a new one</tspan> (mode: new) — overlap count is not consulted again</text>
  </g>
</svg>
