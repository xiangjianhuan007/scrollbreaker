[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "scrollbreaker"
version = "0.1.0"
description = "把滚动的屏幕切成能读的页：滚动累积 + 页面分界判定"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "scrollbreaker contributors" }]
keywords = ["ocr", "screen", "scroll", "llm", "agent", "capture"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Text Processing",
]
dependencies = []

[project.optional-dependencies]
image = ["pillow>=9", "mss>=9"]
dev = ["pytest>=7"]

[project.scripts]
scrollbreaker = "scrollbreaker.cli:main"

[tool.setuptools.packages.find]
include = ["scrollbreaker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
