name: tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest -q

      - name: Smoke test the CLI
        env:
          PYTHONIOENCODING: utf-8
          PYTHONUTF8: "1"
        run: |
          python -m scrollbreaker.cli --version
          python -m scrollbreaker.cli replay examples/frames.jsonl

  # 关键回归单跑一遍，失败时一眼看出是哪条闸门坏了
  gate-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Article and chat must never merge
        run: pytest -q tests/test_accumulate.py::test_article_to_chat_never_merged -v

  # The Android half. No APK is published — this only proves the source compiles,
  # so a fork that breaks the capture loop finds out before shipping.
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Accept SDK licenses and install platform 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - name: Point Gradle at the SDK
        working-directory: android
        run: echo "sdk.dir=$ANDROID_HOME" > local.properties

      - name: Assemble debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon --console=plain

      - name: Report APK
        working-directory: android
        run: ls -lh app/build/outputs/apk/debug/*.apk

